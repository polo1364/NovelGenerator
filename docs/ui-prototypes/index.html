<title>小說工坊介面提案</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;700;900&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..24,300..500,0,0&display=swap">
<style>
/* Layout: three arrangements of the SAME workshop logic (設定→角色→大綱→撰寫→閱讀, modules ①–④, 創作控制台, 手稿, 書櫃, 朗讀, 模型與用量). One visual system so only the arrangement differs. */
:root{
  --bg:#F4F3EF; --sf:#FFFFFF; --sf2:#ECEBE5; --ink:#1D201F; --mut:#626864; --faint:#8E938F; --line:#DCDBD3;
  --ac:#244F63; --acs:#E1EBEF; --acink:#FFFFFF; --ok:#2E7351; --oks:#E1F0E7; --warn:#97640E; --warns:#F8EDD7; --dan:#A8322B;
  --sw:#16181B; --swfg:#ECEDEF; --swmut:#959AA3; --swline:#2B2E34; --swac:#F0C46A;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141617;--sf:#1C1F20;--sf2:#25292A;--ink:#E6E8E6;--mut:#9CA3A0;--faint:#737A77;--line:#30353A;--ac:#8EC1D6;--acs:#1E3039;--acink:#0F1A1F;--ok:#86C9A5;--oks:#1D3127;--warn:#E3B15A;--warns:#352B18;--dan:#E9877F;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141617;--sf:#1C1F20;--sf2:#25292A;--ink:#E6E8E6;--mut:#9CA3A0;--faint:#737A77;--line:#30353A;--ac:#8EC1D6;--acs:#1E3039;--acink:#0F1A1F;--ok:#86C9A5;--oks:#1D3127;--warn:#E3B15A;--warns:#352B18;--dan:#E9877F;color-scheme:dark}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.6}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.ms{font-family:"Material Symbols Outlined";font-weight:400;font-style:normal;font-size:19px;line-height:1;letter-spacing:normal;white-space:nowrap;direction:ltr;display:inline-block;width:1em;overflow:hidden;flex:none;-webkit-font-smoothing:antialiased;vertical-align:middle}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@keyframes bl{50%{opacity:0}}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes fl{from{background:var(--acs)}to{background:transparent}}
.caret{display:inline-block;width:2px;height:1.05em;background:var(--ac);vertical-align:-.15em;animation:bl 1s steps(2) infinite}
.spin{display:inline-block;width:14px;height:14px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--ac);animation:sp .9s linear infinite;vertical-align:-2px}
.flash{animation:fl .7s ease}

/* switcher */
.sw{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding-block:9px;background:var(--sw);color:var(--swfg)}
.sw-l{font-size:12px;letter-spacing:.12em;color:var(--swmut)}
.sw-tabs{display:flex;gap:4px;flex-wrap:wrap}
.sw-tab{border:1px solid var(--swline);background:transparent;border-radius:999px;padding:5px 13px;font-size:13px;color:var(--swmut)}
.sw-tab b{font-weight:500;color:var(--swfg);margin-right:4px}
.sw-tab[aria-selected="true"]{border-color:var(--swac);color:var(--swac)}
.sw-tab[aria-selected="true"] b{color:var(--swac)}
.sw-d{font-size:13px;color:var(--swmut);flex:1 1 260px;min-width:0;margin:0}

/* shared controls */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--sf);border-radius:8px;padding:7px 13px;font-size:13.5px;white-space:nowrap}
.btn:hover{border-color:var(--faint)}
.btn.pri{background:var(--ac);border-color:var(--ac);color:var(--acink);font-weight:500}
.btn.ghost{background:transparent;border-color:transparent;color:var(--mut)}
.btn.ghost:hover{background:var(--sf2);color:var(--ink)}
.btn.sm{padding:4px 10px;font-size:12.5px}
.btn.lg{padding:10px 20px;font-size:15px}
.btn.dan{color:var(--dan)}
.btn[disabled]{opacity:.5;cursor:default}
.btn .ms{font-size:17px}
.f{display:grid;gap:5px;min-width:0}
.f>span{font-size:12.5px;color:var(--mut)}
.f select,.f input,.f textarea{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:8px 10px;font:inherit;font-size:14px;min-width:0;width:100%;box-sizing:border-box}
.f textarea{resize:vertical;min-height:72px;line-height:1.7}
.f select.unset{color:var(--faint)}
.f small{font-size:12px;color:var(--faint);line-height:1.5}
.fg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.fg.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.fg.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;line-height:1.55;cursor:pointer}
.chk input{accent-color:var(--ac);width:16px;height:16px;margin-top:2px;flex:none}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--bg)}
.seg button{border:0;background:transparent;padding:7px 12px;font-size:13px;color:var(--mut)}
.seg button[aria-pressed="true"]{background:var(--ac);color:var(--acink)}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 11px;font-size:12.5px;color:var(--mut)}
.chip[aria-pressed="true"]{background:var(--acs);border-color:var(--ac);color:var(--ac);font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.mh{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.mh h3{margin:0;font-size:16px;font-weight:500;display:flex;align-items:center;gap:8px}
.mh h3 .no{font-family:var(--serif);font-weight:900;color:var(--ac)}
.mh .sp{flex:1}
.mh .meta{font-size:12.5px;color:var(--mut)}
.sub-h{font-size:12.5px;color:var(--mut);margin:18px 0 8px;display:flex;align-items:center;gap:8px}
.sub-h:first-child{margin-top:0}
.cat{margin-bottom:12px}
.cat b{display:block;font-size:12.5px;font-weight:500;color:var(--ink);margin-bottom:6px}
.ctabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:14px}
.ctab{border:0;background:transparent;padding:7px 12px;border-bottom:2px solid transparent;margin-bottom:-1px;color:var(--mut);font-size:13.5px}
.ctab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ac);font-weight:500}
details.deep{margin-top:14px;border-top:1px dashed var(--line);padding-top:12px}
details.deep summary{cursor:pointer;font-size:13px;color:var(--ac)}
.empty{border:1.5px dashed var(--line);border-radius:10px;padding:22px;text-align:center;color:var(--mut);font-size:13.5px;line-height:1.7}
.ol{list-style:none;margin:0;padding:0}
.ol li{display:grid;grid-template-columns:64px minmax(0,1fr);gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.ol li:first-child{border-top:0}
.ol li>span:first-child{color:var(--mut);font-size:12.5px;font-family:var(--mono)}
.ol b{font-weight:500}
.ol .s{color:var(--mut);font-size:13px;display:block}
[contenteditable="true"]{outline:none;border-radius:4px}
[contenteditable="true"]:hover{background:var(--sf2)}
.cons{display:grid;gap:14px}
.cons-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.cons-row .sp{flex:1}
.stat{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.stat div{background:var(--bg);border-radius:8px;padding:9px 12px}
.stat span{display:block;font-size:11.5px;color:var(--mut)}
.stat b{font-family:var(--mono);font-weight:500;font-size:16px;font-variant-numeric:tabular-nums}
.bar{height:5px;border-radius:3px;background:var(--sf2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac);transition:width .4s}
.note{font-size:12.5px;color:var(--mut);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.live{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;color:var(--ok)}
.live i{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.ms-wrap{display:grid;grid-template-columns:180px minmax(0,1fr);gap:24px}
.ms-idx{display:grid;gap:1px;align-content:start}
.ms-idx .lbl{font-size:11.5px;letter-spacing:.14em;color:var(--mut);margin-bottom:6px}
.ms-idx button{border:0;background:transparent;text-align:left;padding:5px 8px;border-radius:6px;font-size:13px;color:var(--mut);display:flex;gap:6px}
.ms-idx button .n{font-family:var(--mono);font-size:11.5px;width:20px;flex:none;padding-top:1px}
.ms-idx button.on{background:var(--acs);color:var(--ac);font-weight:500}
.ms-text{font-family:var(--serif);line-height:2.05;min-height:260px;min-width:0}
.ms-text h4{font-family:var(--serif);font-size:22px;margin:0 0 14px}
.ms-text p{margin:0 0 1em;text-indent:2em}
.ms-text.v{writing-mode:vertical-rl;height:430px;overflow-x:auto;overflow-y:hidden;line-height:2.1}
.ms-text.v h4{margin:0 0 0 18px}
.ms-text .ph{text-indent:0;color:var(--mut);font-family:var(--sans);font-size:14px}
.log{margin-top:18px;border-top:1px solid var(--line);padding-top:12px}
.log summary{cursor:pointer;font-size:13px;color:var(--mut)}
.log ul{margin:10px 0 0;padding:0;list-style:none;display:grid;gap:6px}
.log li{font-size:12.5px;line-height:1.6;padding:7px 10px;border-radius:6px;background:var(--bg);display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px}
.log li .k{color:var(--ac);font-weight:500}
.log li.w .k{color:var(--warn)}
.shelf{display:grid;gap:10px}
.bk{display:flex;gap:14px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--sf);flex-wrap:wrap}
.bk .cv{width:42px;height:60px;border-radius:3px 5px 5px 3px;flex:none;box-shadow:inset 4px 0 0 rgba(0,0,0,.18)}
.bk .nm{flex:1;min-width:140px}
.bk .nm b{font-family:var(--serif);font-size:16px;display:block}
.bk .nm span{font-size:12.5px;color:var(--mut)}
.reader{background:var(--sf);border:1px solid var(--line);border-radius:12px;padding:28px 34px;font-family:var(--serif);font-size:18px;line-height:2.1;min-height:300px}
.reader p{margin:0 0 1em;text-indent:2em}
.rd-nav{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:13px;color:var(--mut)}

/* drawer */
.drawer{position:fixed;inset:0;z-index:50;display:flex;justify-content:flex-end;background:rgba(10,12,14,.35)}
.dr-in{width:min(560px,100%);height:100%;background:var(--sf);display:flex;flex-direction:column;box-shadow:-20px 0 40px -20px rgba(0,0,0,.4);animation:dr .25s ease}
@keyframes dr{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
.dr-h{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line);padding-top:calc(16px + env(safe-area-inset-top,0px))}
.dr-h h3{margin:0;font-size:16px;font-weight:500;flex:1}
.dr-b{flex:1;overflow:auto;padding:20px}
.dr-f{padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}


/* 原稿紙 */
.paper{--grid:#D9958A;--paperbg:#FFFDF6;background:var(--paperbg);border:1px solid var(--grid);padding:14px 16px 10px;border-radius:2px;min-width:0;box-shadow:0 1px 0 var(--line)}
.paper-hd,.paper-ft{display:flex;justify-content:space-between;gap:10px;font-size:11.5px;color:var(--grid);letter-spacing:.08em;font-family:var(--serif)}
.paper-hd{margin-bottom:8px;padding-bottom:6px;border-bottom:2px solid var(--grid)}
.paper-ft{margin-top:8px;padding-top:6px;border-top:2px solid var(--grid);font-family:var(--mono);font-size:11px}
.gaoji{display:grid;grid-template-columns:repeat(var(--per),var(--cs));grid-auto-rows:var(--cs);row-gap:7px;justify-content:center;font-family:var(--serif);color:var(--ink);padding:1px}
.gaoji span{display:grid;place-items:center;outline:1px solid var(--grid);outline-offset:-.5px;line-height:1}
.gaoji span.g{color:var(--faint)}
.gaoji span.k::after{content:"";width:2px;height:70%;background:var(--ac);animation:bl 1s steps(2) infinite}
.paper.v .gaoji{writing-mode:vertical-rl;height:calc(var(--cs) * 20 + 2px);overflow-x:auto;overflow-y:hidden;justify-content:start}
.paper.v .gaoji span.k::after{width:70%;height:2px}
.paper.v .paper-hd,.paper.v .paper-ft{writing-mode:horizontal-tb}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .paper{--grid:#8A4C45;--paperbg:#1E1C19}}
:root[data-theme="dark"] .paper{--grid:#8A4C45;--paperbg:#1E1C19}

/* ===== V1 流程側欄 ===== */
.v1{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:calc(100vh - 50px)}
.v1 .side{background:var(--sf);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 12px;gap:18px;position:sticky;top:0;height:calc(100vh - 50px);box-sizing:border-box}
.brand{font-family:var(--serif);font-weight:900;font-size:18px;padding:0 8px;display:flex;align-items:center;gap:8px}
.brand i{font-style:normal;width:28px;height:28px;border-radius:7px;background:var(--ac);color:var(--acink);display:grid;place-items:center;font-size:14px}
.v1 .lbl{font-size:11.5px;letter-spacing:.14em;color:var(--faint);padding:0 10px;margin-bottom:-10px}
.pnav{display:grid;gap:2px}
.pnav button{border:0;background:transparent;border-radius:9px;padding:9px 10px;display:grid;grid-template-columns:26px minmax(0,1fr);gap:2px 10px;text-align:left;align-items:center}
.pnav button .d{grid-row:span 2;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:12px;font-family:var(--mono);color:var(--mut);background:var(--bg)}
.pnav button.ok .d{background:var(--oks);border-color:var(--ok);color:var(--ok)}
.pnav button .t{font-size:14px}
.pnav button .s{font-size:12px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pnav button[aria-current="page"]{background:var(--acs)}
.pnav button[aria-current="page"] .t{color:var(--ac);font-weight:500}
.pnav button[aria-current="page"] .d{background:var(--ac);border-color:var(--ac);color:var(--acink)}
.v1 .tools{margin-top:auto;display:grid;gap:2px}
.v1 .tools button{justify-content:flex-start;width:100%}
.v1 main{min-width:0}
.v1 .top{display:flex;align-items:center;gap:10px;padding-block:14px;border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:0;z-index:5;flex-wrap:wrap}
.v1 .top h2{margin:0;font-family:var(--serif);font-weight:900;font-size:22px}
.v1 .top .sp{flex:1}
.v1 .page{max-width:980px;margin:0 auto;padding-block:24px 60px;display:grid;gap:18px}
.card{background:var(--sf);border:1px solid var(--line);border-radius:12px;padding:20px 22px;min-width:0}
.next{display:flex;justify-content:flex-end;gap:8px}

/* ===== V2 單頁儀表板 ===== */
.v2{min-height:calc(100vh - 50px)}
.v2 .hdr{position:sticky;top:0;z-index:6;background:var(--bg);border-bottom:1px solid var(--line)}
.v2 .hdr-in{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:16px;padding-block:12px;flex-wrap:wrap}
.pipe{display:flex;align-items:center;gap:0;flex:1;min-width:0;overflow-x:auto}
.pipe button{border:0;background:transparent;display:flex;gap:8px;align-items:center;padding:6px 8px;border-radius:8px;white-space:nowrap}
.pipe button:hover{background:var(--sf2)}
.pipe .d{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:11px;font-family:var(--mono);color:var(--mut);background:var(--sf)}
.pipe button.ok .d{background:var(--ok);border-color:var(--ok);color:#fff}
.pipe .t{font-size:13.5px;font-weight:500}
.pipe .s{font-size:12px;color:var(--mut)}
.pipe .ln{flex:1;min-width:14px;height:1.5px;background:var(--line)}
.v2 .col{max-width:1120px;margin:0 auto;padding-block:24px 70px;display:grid;gap:18px;padding-right:max(76px,env(safe-area-inset-right,0px))}
.sumgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.sum{background:var(--sf);border:1px solid var(--line);border-radius:12px;padding:14px 16px;text-align:left;display:grid;gap:6px;align-content:start;transition:border-color .15s,transform .15s}
.sum:hover{border-color:var(--ac);transform:translateY(-2px)}
.sum .h{display:flex;justify-content:space-between;align-items:center;font-size:13.5px;font-weight:500}
.sum .h .no{font-family:var(--serif);font-weight:900;color:var(--ac);margin-right:6px}
.sum .h .ms{color:var(--faint);font-size:17px}
.sum .v{font-size:13px;color:var(--mut);line-height:1.6;min-height:3.2em}
.sum .v b{color:var(--ink);font-weight:500}
.sum.ok .st{color:var(--ok)}
.sum .st{font-size:12px;color:var(--warn)}
.v2 .two{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px;align-items:start}
.rail{position:fixed;right:max(14px,env(safe-area-inset-right,0px));top:50%;transform:translateY(-30%);display:grid;gap:4px;background:var(--sf);border:1px solid var(--line);border-radius:14px;padding:6px;z-index:7}
.rail button{border:0;background:transparent;border-radius:10px;width:46px;height:46px;display:grid;place-items:center;color:var(--mut);position:relative}
.rail button:hover{background:var(--sf2);color:var(--ink)}
.rail button span.tt{position:absolute;right:54px;top:50%;transform:translateY(-50%);background:var(--ink);color:var(--bg);font-size:12px;padding:3px 8px;border-radius:6px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s}
.rail button:hover span.tt{opacity:1}

/* ===== V2 color system: each workflow stage owns a hue ===== */
#v2{--m1:#2F6FB5;--m1s:#E6EFFA;--m2:#7550B5;--m2s:#F0EAF9;--m3:#B8720F;--m3s:#FBF0DC;--m4:#C0436A;--m4s:#FBE7EE;--m5:#22806A;--m5s:#DFF2EB;--on:#FFFFFF;--hb:#1D3343;--hbfg:#EEF3F6;--hbmut:#9FB3C0;--paper:#FFFDF7;--c:var(--ac);--cs:var(--acs)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #v2{--m1:#86B5EC;--m1s:#1C2A3B;--m2:#BBA0E8;--m2s:#2A2338;--m3:#E9B663;--m3s:#33291A;--m4:#EF97B2;--m4s:#38222B;--m5:#80D1B5;--m5s:#1A3029;--on:#11161A;--hb:#0F1B23;--paper:#1F2220}}
:root[data-theme="dark"] #v2{--m1:#86B5EC;--m1s:#1C2A3B;--m2:#BBA0E8;--m2s:#2A2338;--m3:#E9B663;--m3s:#33291A;--m4:#EF97B2;--m4s:#38222B;--m5:#80D1B5;--m5s:#1A3029;--on:#11161A;--hb:#0F1B23;--paper:#1F2220}
#v2 .k-story,#v2 .p-setup,#v2 [data-k="story"]{--c:var(--m1);--cs:var(--m1s)}
#v2 .k-adv,#v2 .p-read,#v2 [data-k="adv"]{--c:var(--m2);--cs:var(--m2s)}
#v2 .k-special,#v2 .k-outline,#v2 .p-outline,#v2 [data-k="special"],#v2 [data-k="outline"]{--c:var(--m3);--cs:var(--m3s)}
#v2 .k-chars,#v2 .p-cast,#v2 [data-k="chars"]{--c:var(--m4);--cs:var(--m4s)}
#v2 .k-console,#v2 .p-write{--c:var(--m5);--cs:var(--m5s)}
#v2 .hdr{background:var(--hb);color:var(--hbfg);border-bottom:0}
#v2 .hdr .brand i{background:#F0C46A;color:#1D3343}

#v2 .pipe .d{background:transparent;border-color:var(--c);color:var(--hbfg)}
#v2 .pipe button.ok .d{background:var(--c);border-color:var(--c);color:var(--on)}
#v2 .pipe .s{color:var(--hbmut)}
#v2 .pipe .ln{background:rgba(255,255,255,.16)}
#v2 .sum{background:var(--cs);border-color:transparent}

#v2 .sum .hl{display:flex;gap:10px;align-items:center}
#v2 .sum.ok .st{color:var(--c);font-weight:500}
#v2 .card .mh h3 .ms,#v2 .card .mh h3 .no,#v2 [data-k] .mh h3 .no{color:var(--c)}
#v2 .k-console{background:linear-gradient(180deg,var(--m5s),var(--sf) 140px)}

#v2 .k-console .stat div:nth-child(1){background:var(--m1s)}#v2 .k-console .stat div:nth-child(1) b{color:var(--m1)}
#v2 .k-console .stat div:nth-child(2){background:var(--m5s)}#v2 .k-console .stat div:nth-child(2) b{color:var(--m5)}
#v2 .k-console .stat div:nth-child(3){background:var(--m2s)}#v2 .k-console .stat div:nth-child(3) b{color:var(--m2)}
#v2 .k-console .stat div:nth-child(4){background:var(--m3s)}#v2 .k-console .stat div:nth-child(4) b{color:var(--m3)}

#v2 .k-outline{background:linear-gradient(180deg,var(--m3s),var(--sf) 120px)}
#v2 .k-outline .btn.pri{background:var(--m3);border-color:var(--m3);color:var(--on)}
#v2 .k-outline .ol li>span:first-child{color:var(--m3)}
#v2 .k-manuscript{background:var(--paper)}
#v2 .k-manuscript .ms-idx button.on{background:var(--m1s);color:var(--m1)}
#v2 .k-manuscript .seg button[aria-pressed="true"]{background:var(--m1);color:var(--on)}
#v2 .k-manuscript .log li .k{color:var(--m5)}
#v2 .k-manuscript .log li.w .k{color:var(--m4)}
#v2 .k-manuscript .ms-text h4{color:var(--m1)}
#v2 .rail{background:var(--hb);border-color:var(--hb)}
#v2 .rail button{color:var(--hbmut)}
#v2 .rail button:hover{background:rgba(255,255,255,.1);color:#fff}
#v2 .rail button:nth-child(1) .ms{color:#86B5EC}#v2 .rail button:nth-child(2) .ms{color:#BBA0E8}#v2 .rail button:nth-child(3) .ms{color:#80D1B5}#v2 .rail button:nth-child(4) .ms{color:#E9B663}#v2 .rail button:nth-child(5) .ms{color:#EF97B2}#v2 .rail button:nth-child(6) .ms{color:#F0C46A}
#v2 .dr-in[data-k] .dr-h{background:var(--cs)}
#v2 .dr-in[data-k] .dr-h h3{color:var(--c)}
#v2 .dr-in[data-k] .chip[aria-pressed="true"]{background:var(--cs);border-color:var(--c);color:var(--c)}
#v2 .dr-in[data-k] .ctab[aria-selected="true"]{border-bottom-color:var(--c);color:var(--c)}
#v2 .dr-in[data-k] .seg button[aria-pressed="true"],#v2 .dr-in[data-k] .btn.pri{background:var(--c);border-color:var(--c);color:var(--on)}
#v2 .dr-in[data-k] .f select:focus,#v2 .dr-in[data-k] .f input:focus,#v2 .dr-in[data-k] .f textarea:focus{border-color:var(--c);outline:none;box-shadow:0 0 0 3px var(--cs)}
#v2 .dr-in[data-k] .chk input{accent-color:var(--c)}

/* ===== B bookshelf (full screen) ===== */
.shx{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;animation:dr .25s ease}
.shx-h{background:var(--hb,#1D3343);color:var(--hbfg,#EEF3F6);padding-block:16px 0;padding-top:calc(16px + env(safe-area-inset-top,0px))}
.shx-hi{max-width:1240px;margin:0 auto;display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.shx-t{display:grid;gap:2px}
.shx-t small{font-size:11px;letter-spacing:.24em;color:var(--hbmut,#9FB3C0)}
.shx-t h2{margin:0;font-family:var(--serif);font-weight:900;font-size:28px}
.shx-stats{display:flex;gap:18px;margin-left:12px;padding-bottom:4px;flex-wrap:wrap}
.shx-stats div{display:grid}
.shx-stats b{font-family:var(--mono);font-weight:500;font-size:18px;color:#F0C46A}
.shx-stats span{font-size:11.5px;color:var(--hbmut,#9FB3C0)}
.shx-hi .sp{flex:1}
.shx-x{border:0;background:rgba(255,255,255,.08);color:inherit;border-radius:10px;width:40px;height:40px;display:grid;place-items:center}
.shx-bar{max-width:1240px;margin:14px auto 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-bottom:14px}
.shx-search{flex:1 1 200px;min-width:0;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.1);border-radius:10px;padding:0 12px}
.shx-search input{flex:1;min-width:0;border:0;background:transparent;color:inherit;font:inherit;padding:10px 0}
.shx-search input::placeholder{color:var(--hbmut,#9FB3C0)}
.shx-search input:focus{outline:none}
.shx-sel{border:0;background:rgba(255,255,255,.1);color:inherit;border-radius:10px;padding:10px 12px;font:inherit;font-size:13.5px}
.shx-sel option{color:#1D201F}
.shx-view{display:inline-flex;background:rgba(255,255,255,.1);border-radius:10px;padding:3px}
.shx-view button{border:0;background:transparent;color:var(--hbmut,#9FB3C0);border-radius:8px;padding:7px 11px;font-size:13px;display:flex;gap:6px;align-items:center}
.shx-view button[aria-pressed="true"]{background:#F0C46A;color:#1D3343;font-weight:500}
.shx-cases{display:flex;gap:6px;align-items:center;background:rgba(255,255,255,.1);border-radius:10px;padding:5px 8px}
.shx-cases span{font-size:12px;color:var(--hbmut,#9FB3C0);margin-right:2px}
.shx-cases button{width:26px;height:26px;border-radius:7px;border:2px solid transparent;padding:0;position:relative}
.shx-cases button[aria-pressed="true"]{border-color:#F0C46A}
.shx-act{border:0;background:rgba(255,255,255,.1);color:inherit;border-radius:10px;padding:9px 12px;font-size:13px;display:flex;gap:6px;align-items:center}
.shx-act:hover,.shx-x:hover{background:rgba(255,255,255,.18)}
.shx-act.pri{background:#F0C46A;color:#1D3343;font-weight:500}
.shx-body{flex:1;overflow:auto}
.shx-in{max-width:1240px;margin:0 auto;padding-block:26px 60px}

/* ---- bookcase: one look per data-case ---- */
.case{--back:#2B1D15;--grain:rgba(255,255,255,.03);--plank:linear-gradient(#80583A,#5A3A24);--edge:#3D2716;--frame:#3E2A1D;--lbl:#E9D7A8;--lblink:#3D2716;--plate:#C9A65D;--plateink:#2B1D15;--gap:46px;
  position:relative;background:var(--back);background-image:repeating-linear-gradient(90deg,var(--grain) 0 2px,transparent 2px 38px);border:14px solid var(--frame);border-top-width:22px;border-radius:6px;padding:26px 22px 4px;box-shadow:0 26px 40px -24px rgba(0,0,0,.55),inset 0 0 60px rgba(0,0,0,.35)}
.case+.case{margin-top:28px}
.case[data-case="oak"]{--back:#EFE6D4;--grain:rgba(120,80,30,.05);--plank:linear-gradient(#DDBE8F,#C29862);--edge:#A97E48;--frame:#D2B07F;--lbl:#FFFDF5;--lblink:#6B4A22;--plate:#6B4A22;--plateink:#FFF7E6;box-shadow:0 26px 40px -24px rgba(80,50,10,.35),inset 0 0 50px rgba(120,80,30,.12)}
.case[data-case="iron"]{--back:#3B3C3F;--grain:transparent;--plank:linear-gradient(#2A2B2E,#141517);--edge:#09090A;--frame:#111214;--lbl:#E8C547;--lblink:#111214;--plate:#E8C547;--plateink:#111214;border-width:8px;border-top-width:8px;border-radius:2px;
  background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:64px 26px,64px 52px}
.case[data-case="classic"]{--back:#1F3A2F;--grain:rgba(255,255,255,.025);--plank:linear-gradient(#7A3220,#4B1B10);--edge:#2E0F08;--frame:#5A2617;--lbl:#E9C98A;--lblink:#4B1B10;--plate:#C9A65D;--plateink:#2E0F08;border-top-width:34px;
  background-image:radial-gradient(circle at 50% 50%,rgba(233,201,138,.06) 0 6px,transparent 7px);background-size:40px 40px}
.case[data-case="classic"]::before{content:"";position:absolute;left:-20px;right:-20px;top:-46px;height:14px;background:#6B2E1C;border-radius:3px 3px 0 0;box-shadow:0 4px 0 #4B1B10}
.case[data-case="white"]{--back:transparent;--grain:transparent;--plank:linear-gradient(#FFFFFF,#ECEBE6);--edge:#D8D6CE;--frame:transparent;--lbl:transparent;--lblink:var(--mut);--plate:var(--ink);--plateink:var(--bg);border:0;box-shadow:none;padding:10px 0 0}
.case-plate{position:absolute;top:-17px;left:50%;transform:translateX(-50%);background:var(--plate);color:var(--plateink);font-size:12px;letter-spacing:.14em;padding:2px 14px;border-radius:3px;white-space:nowrap;box-shadow:0 2px 0 rgba(0,0,0,.25);z-index:2}
.case[data-case="white"] .case-plate{position:static;transform:none;display:inline-block;margin:0 0 18px}
.case[data-case="classic"] .case-plate{top:-28px}
.row{position:relative;display:flex;align-items:flex-end;gap:3px;padding:0 6px;margin-bottom:var(--gap);min-height:190px}
.row::after{content:"";position:absolute;left:-22px;right:-22px;bottom:-18px;height:18px;background:var(--plank);border-bottom:4px solid var(--edge);box-shadow:0 10px 12px -6px rgba(0,0,0,.45)}
.case[data-case="white"] .row::after{left:0;right:0;border-radius:2px;box-shadow:0 14px 16px -10px rgba(0,0,0,.25)}
.case[data-case="iron"] .row::after{height:10px;bottom:-10px;border-bottom-width:2px}
/* face-out cover on the shelf */
.slot{position:relative;display:flex;flex-direction:column;align-items:center;width:124px;flex:none;margin:0 6px;border:0;background:none;padding:0;color:inherit}
.slot .cvr-wrap{width:124px;transition:transform .2s ease}
.slot:hover .cvr-wrap{transform:translateY(-8px) rotate(-1.5deg)}
.slot.lean .cvr-wrap{transform:rotate(-4deg);transform-origin:bottom left}
.slot.lean:hover .cvr-wrap{transform:rotate(-2deg) translateY(-6px)}
.slot .lb{position:absolute;bottom:-17px;left:50%;transform:translateX(-50%);max-width:118px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:10.5px;line-height:14px;padding:0 6px;background:var(--lbl);color:var(--lblink);border-radius:2px;z-index:3}
.case[data-case="white"] .slot .lb{bottom:-36px;background:transparent;font-size:12px;max-width:124px}
.case[data-case="white"] .row{margin-bottom:62px}
.bkc.series .cvr-wrap,.slot.series .cvr-wrap{position:relative}
.slot.series .cvr-wrap::before,.slot.series .cvr-wrap::after{content:"";position:absolute;inset:0;border-radius:3px 7px 7px 3px;background:rgba(0,0,0,.35)}
.slot.series .cvr-wrap::before{transform:translate(9px,-5px)}
.slot.series .cvr-wrap::after{transform:translate(4.5px,-2.5px);background:rgba(0,0,0,.22)}
.slot .cvr-wrap .cvr{position:relative;z-index:1}
/* spine */
.spn{border:0;padding:10px 0 8px;border-radius:3px 3px 1px 1px;display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .2s ease;box-shadow:inset -3px 0 0 rgba(0,0,0,.2),inset 2px 0 0 rgba(255,255,255,.14),2px 0 3px rgba(0,0,0,.28);position:relative;flex:none;box-sizing:border-box}
.spn:hover{transform:translateY(-16px)}
.spn .st{writing-mode:vertical-rl;font-family:var(--serif);font-weight:700;font-size:14px;letter-spacing:.1em;flex:1 1 auto;min-height:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;line-height:1.15}
.spn .sv{font-size:10px;writing-mode:vertical-rl;opacity:.85;flex:none}
.spn .mk{font-size:14px;opacity:.9;flex:none}
.spn .rib{position:absolute;top:-13px;width:7px;height:16px;background:#B5383A;clip-path:polygon(0 0,100% 0,100% 100%,50% 76%,0 100%)}
.spn.tilt{transform:rotate(-7deg);transform-origin:bottom left;margin-right:12px}
.spn.tilt:hover{transform:rotate(-7deg) translateY(-10px)}
.spn.out{transform:scale(1.04);box-shadow:inset -3px 0 0 rgba(0,0,0,.2),inset 2px 0 0 rgba(255,255,255,.14),6px 6px 12px rgba(0,0,0,.45);z-index:2}
.spn.out:hover{transform:scale(1.04) translateY(-14px)}
/* spine designs */
.s-label::before,.s-label::after{content:"";position:absolute;left:0;right:0;height:3px;background:var(--fg);opacity:.55}
.s-label::before{top:7px}.s-label::after{bottom:27px}
.s-label .st{flex:0 1 auto;background:#F4EEDC;color:#2A2420;padding:7px 1px;border-radius:2px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25);margin-top:10px}
.s-label .mk{margin-top:auto}
.s-gilt{background-image:linear-gradient(90deg,rgba(0,0,0,.28),transparent 30%,transparent 70%,rgba(0,0,0,.32))!important}
.s-gilt::before,.s-gilt::after{content:"";position:absolute;left:0;right:0;height:14px;background:linear-gradient(var(--fg),var(--fg)) 0 0/100% 2px no-repeat,linear-gradient(var(--fg),var(--fg)) 0 6px/100% 1px no-repeat,linear-gradient(var(--fg),var(--fg)) 0 12px/100% 2px no-repeat;opacity:.85}
.s-gilt::before{top:9px}.s-gilt::after{bottom:24px}
.s-gilt .st{margin-top:22px;margin-bottom:20px}
.s-cloth{background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.08) 0 1px,transparent 1px 4px),repeating-linear-gradient(-45deg,rgba(0,0,0,.08) 0 1px,transparent 1px 4px)!important}
.s-cloth .mk{border:1.5px solid currentColor;border-radius:50%;width:20px;height:20px;display:grid;place-items:center;font-size:12px;box-sizing:border-box}
.s-cloth .st{margin-top:4px}
.s-modern{padding-top:8px}
.s-modern .ini{font-family:var(--sans);font-weight:700;font-size:17px;line-height:1;padding-bottom:6px;border-bottom:2px solid currentColor;width:68%;text-align:center;flex:none}
.s-modern .st{font-family:var(--sans);font-weight:500;letter-spacing:.22em}
.s-band::before{content:"";position:absolute;left:0;right:0;top:20px;height:14px;background:var(--fg);opacity:.92}
.s-band .st{margin-top:32px}
.s-paper{border-radius:2px;background-image:linear-gradient(90deg,rgba(255,255,255,.3),transparent 35%,transparent 72%,rgba(0,0,0,.2))!important}
.s-paper .mk{background:var(--fg);color:var(--bg);border-radius:3px;font-size:12px;padding:2px}
.s-paper::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:rgba(0,0,0,.18)}
/* horizontal stack */
.stack{display:flex;flex-direction:column-reverse;align-items:flex-start;gap:0;flex:none;margin:0 6px}
.flat{border:0;border-radius:1px 3px 3px 1px;display:flex;align-items:center;gap:8px;padding:0 10px;font-family:var(--serif);font-weight:700;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:inset 0 -3px 0 rgba(0,0,0,.2),inset 0 2px 0 rgba(255,255,255,.12),0 2px 3px rgba(0,0,0,.2);transition:transform .2s}
.flat:hover{transform:translateX(8px)}
.divider{flex:none;width:28px;height:128px;margin:0 6px;border-radius:8px 8px 1px 1px;background:var(--plate);color:var(--plateink);writing-mode:vertical-rl;font-size:12px;letter-spacing:.14em;display:flex;align-items:center;padding-top:10px;box-sizing:border-box;box-shadow:2px 0 3px rgba(0,0,0,.25);white-space:nowrap;overflow:hidden}
.deco{flex:none;align-self:flex-end;font-size:40px;line-height:1;opacity:.85;margin:0 6px}
/* covers */
.cvr{position:relative;aspect-ratio:2/3;max-width:100%;border-radius:3px 7px 7px 3px;overflow:hidden;box-shadow:0 8px 16px -10px rgba(0,0,0,.55),inset 7px 0 0 rgba(0,0,0,.16),inset 8px 0 0 rgba(255,255,255,.12);display:flex;flex-direction:column;padding:12px 10px 10px 16px;box-sizing:border-box}
.cvr .ct{font-family:var(--serif);font-weight:900;line-height:1.25;position:relative;z-index:1;font-size:17px}
.cvr .ca{font-size:9px;letter-spacing:.16em;opacity:.8;margin-top:auto;position:relative;z-index:1}
.cvr .mo{position:absolute;opacity:.9;z-index:0}
.cvr .ser{position:absolute;top:6px;right:6px;z-index:2;background:rgba(0,0,0,.6);color:#fff;font-size:10px;border-radius:999px;padding:1px 7px}
.d-ink{background:#F3F0E6;color:#1F2A33}
.d-ink::before{content:"";position:absolute;left:-10%;right:-10%;bottom:0;height:55%;background:radial-gradient(60% 70% at 25% 100%,#7E8D99 0 40%,transparent 41%),radial-gradient(55% 80% at 70% 100%,#4F606E 0 45%,transparent 46%),radial-gradient(40% 60% at 95% 100%,#A9B4BC 0 50%,transparent 51%)}
.d-ink .ct{writing-mode:vertical-rl;font-size:19px;letter-spacing:.16em;align-self:flex-end;margin-top:16px}
.d-ink .seal{position:absolute;right:12px;bottom:44%;width:14px;height:14px;background:#B5383A;z-index:1;border-radius:2px}
.d-gothic{background:#4A1520;color:#E9C98A}
.d-gothic::before{content:"";position:absolute;inset:8px 8px 8px 14px;border:1.5px solid #C9A65D;outline:1px solid #C9A65D;outline-offset:-5px;border-radius:40% 40% 2px 2px/22% 22% 2px 2px}
.d-gothic .ct{text-align:center;margin-top:38%;letter-spacing:.08em}
.d-gothic .ca{text-align:center}
.d-floral{background:#FBE9E7;color:#8A2F4A;background-image:radial-gradient(#F3B6C1 3px,transparent 4px),radial-gradient(#F7D2B0 2px,transparent 3px);background-size:22px 22px,16px 16px;background-position:0 0,8px 9px}
.d-floral .ct{background:#FFF7F4;padding:8px 6px;border-radius:4px;margin-top:30%;text-align:center}
.d-star{background:#121A3A;color:#EADCB0;background-image:radial-gradient(1px 1px at 20% 30%,#fff,transparent),radial-gradient(1.5px 1.5px at 70% 20%,#fff,transparent),radial-gradient(1px 1px at 40% 70%,#fff,transparent),radial-gradient(1px 1px at 85% 60%,#fff,transparent),radial-gradient(1.5px 1.5px at 15% 85%,#fff,transparent)}
.d-star::before{content:"";position:absolute;width:62%;aspect-ratio:1;left:24%;top:14%;border:1.5px solid #D8B460;border-radius:50%;box-shadow:inset 0 0 0 9px rgba(216,180,96,.12)}
.d-star .ct{margin-top:auto;text-align:center}
.d-star .ca{margin-top:5px;text-align:center}
.d-noir{background:#22252B;color:#E9E5DA;background-image:repeating-linear-gradient(135deg,transparent 0 12px,rgba(255,255,255,.04) 12px 13px)}
.d-noir::before{content:"CASE FILE";position:absolute;left:0;right:0;top:38%;background:#E8C547;color:#22252B;font-family:var(--mono);font-size:10px;letter-spacing:.3em;text-align:center;padding:3px 0}
.d-wood{background:#2F5B46;color:#F1E9D2;background-image:repeating-linear-gradient(0deg,transparent 0 6px,rgba(0,0,0,.12) 6px 7px)}
.d-wood .ct{writing-mode:vertical-rl;font-size:19px;letter-spacing:.2em;border:1.5px solid #F1E9D2;padding:8px 5px;align-self:center;margin-top:10%}
.d-botanic{background:#F2EFE2;color:#2F4A2A}
.d-botanic .mo{right:-6px;bottom:16%;color:#7FA36B;font-size:84px;transform:rotate(-18deg)}
.d-botanic .ct{font-size:15px;border-bottom:1px solid #2F4A2A;padding-bottom:5px}
.d-minimal{background:#FAFAF7;color:#111}
.d-minimal::before{content:"";position:absolute;left:16px;right:10px;top:44%;height:9px;background:#111}
.d-minimal::after{content:"";position:absolute;right:14px;top:calc(44% + 20px);width:11px;height:11px;border-radius:50%;background:#C8372D}
.d-minimal .ct{font-size:15px}
.d-deco{background:#14181F;color:#E4C77E;background-image:repeating-conic-gradient(from -60deg at 50% 108%,rgba(228,199,126,.28) 0 4deg,transparent 4deg 12deg)}
.d-deco::before{content:"";position:absolute;inset:7px 7px 7px 13px;border:1px solid #E4C77E}
.d-deco .ct{text-align:center;letter-spacing:.14em;margin-top:14%}

    {id:"setup",t:"設定",en:"SETUP",s:S.theme||"—",ok:!!S.theme},
    {id:"cast",t:"角色",en:"CAST",s:`${S.chars.length} 位`,ok:S.chars.length>0},
    {id:"outline",t:"大綱",en:"OUTLINE",s:S.outline.length?`${S.outline.length} 章`:"—",ok:S.outline.length>0},
    {id:"write",t:"撰寫",en:"DRAFT",s:`${wordsDone().toLocaleString()} 字`,ok:S.gen.written.length>0},
    {id:"read",t:"閱讀",en:"READ",s:`${S.gen.written.length} 章`,ok:S.gen.written.length>0}];}
  function sums(){const a=S.adv;return{
    story:{ok:!!(S.theme&&S.setting&&S.style),v:S.theme?`<b>${esc(S.theme)}</b>・${esc(S.setting||"未選背景")}・${esc(S.style||"未選風格")}<br>${S.chapters} 章／${S.words.toLocaleString()} 字／${S.volumes} 集`:"尚未設定"},
    adv:{ok:!!(a.era||a.narrative),v:(a.era||a.narrative||a.pacing)?[a.era,a.narrative,a.pacing,a.tone,a.ending].filter(Boolean).map(esc).join("・"):"尚未設定（可交給 AI）"},
    special:{ok:S.special.size>0||!!S.rules,v:S.special.size||S.rules?`已選 ${S.special.size} 項：${[...S.special].slice(0,3).join("、")}${S.special.size>3?"…":""}${S.rules?"<br>自訂規則 1 條":""}`:"尚未設定"},
    chars:{ok:S.chars.length>0,v:S.chars.length?S.chars.map(c=>`<b>${esc(c.name||"未命名")}</b>`).join("、")+`<br>${S.chars.length} 位人物`:"尚未設定"},
    outline:{ok:S.outline.length>0,v:S.outline.length?`${S.outline.length} 章大綱`:"尚未生成"}};}

  /* -- field helpers -- */
  const sel=(label,path,opts)=>{const v=getP(path);return `<label class="f"><span>${label}</span><select data-bind="${path}" class="${v?"":"unset"}"><option value="">請選擇${label}</option>${opts.map(o=>`<option ${o===v?"selected":""}>${o}</option>`).join("")}</select></label>`;};
  const num=(label,path,ph,hint)=>`<label class="f"><span>${label}</span><input type="number" data-bind="${path}" data-num value="${getP(path)}" placeholder="${ph}">${hint?`<small>${hint}</small>`:""}</label>`;

  /* -- modules -- */
  const M={};
  M.story=()=>`<div class="mh"><h3><span class="no">①</span>故事設定</h3><span class="sp"></span><button class="btn sm" data-act="randStory"><span class="ms">casino</span>隨機填充</button></div>
    <div class="fg">${sel("主題","theme",OPT.theme)}${sel("背景設定","setting",OPT.setting)}${sel("故事風格","style",OPT.style)}</div>
    <div class="fg" style="margin-top:14px">${num("章節數","chapters","如：10")}${num("預計總字數","words","如：50000","AI 依「總字數 ÷ 章節數」要求每章篇幅")}${num("預計集數","volumes","1","2 以上＝系列分集")}</div>
    <label class="chk" style="margin-top:14px"><input type="checkbox" data-bind="autoAll" ${S.autoAll?"checked":""}>自動生成全部章節（逐章自動接續到章節數；分集時一集接一集寫完）</label>`;
  M.adv=()=>`<div class="mh"><h3><span class="no">②</span>進階設定</h3><span class="sp"></span><button class="btn sm" data-act="randAdv"><span class="ms">casino</span>隨機進階</button></div>
    <div class="fg c4">${sel("時代設定","adv.era",OPT.era)}${sel("世界觀複雜度","adv.complexity",OPT.complexity)}${sel("內容分級","adv.rating",OPT.rating)}${sel("敘事視角","adv.narrative",OPT.narrative)}${sel("故事節奏","adv.pacing",OPT.pacing)}${sel("情感基調","adv.tone",OPT.tone)}${sel("結局傾向","adv.ending",OPT.ending)}
    <label class="f"><span>隨機種子</span><span style="display:flex;gap:6px"><input data-bind="adv.seed" value="${S.adv.seed}" style="font-family:var(--mono)"><button class="btn sm" data-act="seed" aria-label="換種子"><span class="ms">refresh</span></button></span></label></div>
    <div class="sub-h" style="margin-top:16px">創意幅度</div><div class="seg">${OPT.creativity.map(c=>`<button data-seg="adv.creativity" data-v="${c}" aria-pressed="${c===S.adv.creativity}">${c}${c==="穩定"?"・清晰一致":c==="豐富"?"・平衡變化":"・大膽結構"}</button>`).join("")}</div>`;
  M.special=()=>`<div class="mh"><h3><span class="no">③</span>特殊元素與規則</h3><span class="meta" data-live="spcount">已選 ${S.special.size} 項</span><span class="sp"></span><button class="btn sm ghost" data-act="clearSp">清除</button><button class="btn sm" data-act="drama"><span class="ms">theater_comedy</span>戲劇化</button></div>
    ${SPECIAL.map(([c,items])=>`<div class="cat"><b>${c}</b><div class="chips">${items.map(i=>`<button class="chip" data-sp="${i}" aria-pressed="${S.special.has(i)}">${i}</button>`).join("")}</div></div>`).join("")}
    <label class="f" style="margin-top:12px"><span>自訂規則</span><textarea data-bind="rules" placeholder="例如：結局必須是悲劇、禁止穿越設定、全劇不可出現男性角色…">${esc(S.rules)}</textarea><small>補充前兩區沒涵蓋的要求；生成大綱、設計角色與撰寫正文時都會遵守。劇情大綱請在「大綱」管理。</small></label>`;
  M.chars=()=>{const c=S.chars[S.ac]||{};return `<div class="mh"><h3><span class="no">④</span>人物設計</h3><span class="meta">${S.chars.length} 位</span><span class="sp"></span><button class="btn sm pri" data-act="aiChars"><span class="ms">auto_awesome</span>AI 設計角色群</button><button class="btn sm" data-act="names"><span class="ms">list</span>人名清單</button><button class="btn sm" data-act="randChars"><span class="ms">casino</span>隨機湊組</button><button class="btn sm" data-act="addChar"><span class="ms">add</span>新增人物</button></div>
    ${S.chars.length?`<div class="ctabs">${S.chars.map((x,i)=>`<button class="ctab" data-ctab="${i}" aria-selected="${i===S.ac}">${esc(x.name||"人物 "+(i+1))}</button>`).join("")}</div>
    <div class="fg c4"><label class="f"><span>姓名</span><input data-cbind="name" value="${esc(c.name)}"></label><label class="f"><span>性別</span><select data-cbind="gender">${OPT.gender.map(g=>`<option ${g===c.gender?"selected":""}>${g}</option>`).join("")}</select></label><label class="f"><span>年齡</span><input data-cbind="age" value="${esc(c.age)}"></label><label class="f"><span>定位</span><input data-cbind="role" value="${esc(c.role)}"></label></div>
    <div class="fg c2" style="margin-top:14px">${[["personality","性格"],["goal","目標"],["weakness","弱點"],["secret","秘密"]].map(([k,l])=>`<label class="f"><span>${l}</span><input data-cbind="${k}" value="${esc(c[k])}"></label>`).join("")}</div>
    <label class="f" style="margin-top:14px"><span>人物關係</span><input data-cbind="relation" value="${esc(c.relation)}"></label>
    <details class="deep"><summary>深入設計（六項，選填）</summary><div class="fg c2" style="margin-top:12px">${DEEP.map(([k,l,ph])=>`<label class="f"><span>${l}</span><textarea data-cbind="${k}" placeholder="${ph}" style="min-height:60px">${esc(c[k]||"")}</textarea></label>`).join("")}</div></details>
    <div style="margin-top:14px;display:flex;justify-content:flex-end"><button class="btn sm dan" data-act="delChar"><span class="ms">delete</span>移除此人物</button></div>`:`<div class="empty">還沒有人物。按「AI 設計角色群」依故事條件一次設計好，或「新增人物」自己填。</div>`}`;};
  M.outline=()=>`<div class="mh"><h3><span class="ms" style="color:var(--ac)">account_tree</span>預覽大綱</h3><span class="meta">先確認方向，再生成正文，節省時間與額度</span><span class="sp"></span>${S.outline.length?`<button class="btn sm" data-act="genOutline"><span class="ms">refresh</span>重新生成</button><button class="btn sm ghost" data-act="clearOutline">清除大綱</button>`:""}</div>
    ${S.obusy?`<div class="empty"><span class="spin"></span>　正在依故事設定與人物生成 ${S.chapters} 章大綱…</div>`:S.outline.length?`<ol class="ol">${S.outline.map((o,i)=>`<li><span>第 ${String(i+1).padStart(2,"0")} 章</span><span contenteditable="true"><b>${o[0]}</b><span class="s">${o[1]}</span></span></li>`).join("")}</ol>`:`<div class="empty">尚未生成大綱。<br>「預計集數」在故事設定裡調整；2 集以上會依集數分別生成。<br><br><button class="btn pri" data-act="genOutline"><span class="ms">auto_awesome</span>生成大綱</button></div>`}`;
  M.console=()=>{const g=S.gen,n=g.written.length,tot=S.chapters;return `<div class="mh"><h3><span class="ms" style="color:var(--ac)">edit_square</span>創作控制台</h3><span class="sp"></span>${g.running?`<span class="live"><i></i>LIVE・創作中</span>`:`<span class="note"><span class="ms" style="font-size:16px">cloud_done</span>已自動保存</span>`}</div>
    <div class="cons"><div class="cons-row">
      ${g.running?`<button class="btn pri lg" data-act="stop"><span class="ms">stop_circle</span>停止生成</button>`:n===0?`<button class="btn pri lg" data-act="start"><span class="ms">play_arrow</span>開始生成小說</button>`:n<tot?`<button class="btn pri lg" data-act="cont"><span class="ms">fast_forward</span>繼續生成</button>`:`<button class="btn pri lg" data-act="read"><span class="ms">auto_stories</span>進入閱讀</button>`}
      ${n>0&&!g.running&&n<tot?`<button class="btn" data-act="start" disabled title="已開始">開始生成小說</button>`:""}
      <label class="chk" style="margin-left:6px"><input type="checkbox" data-bind="autoAll" ${S.autoAll?"checked":""}>自動生成全部章節</label>
      <span class="sp"></span><button class="btn ghost" data-act="clearGen" ${n&&!g.running?"":"disabled"}><span class="ms">mop</span>清除結果</button></div>
    <div class="stat"><div><span>狀態</span><b style="font-family:var(--sans);font-size:14px" data-live="state">${g.running?`寫第 ${n+1} 章`:n>=tot?"全部完成":n?"已暫停":"準備生成"}</b></div><div><span>已生成</span><b data-live="words">${wordsDone().toLocaleString()} 字</b></div><div><span>已耗時</span><b data-live="secs">${Math.floor(g.secs/60)}:${String(g.secs%60).padStart(2,"0")}</b></div><div><span>累計費用</span><b data-live="cost">$${cost()}</b></div></div>
    <div><div class="note" style="justify-content:space-between;margin-bottom:5px"><span>章節進度 ${n}／${tot}</span><span>一段生成參考費用 約 US$0.006・${S.model.split(" — ")[0]}</span></div><div class="bar"><i style="width:${n/tot*100}%"></i></div></div>
    ${!S.outline.length&&!n?`<div class="note"><span class="ms" style="font-size:16px;color:var(--warn)">info</span>還沒有大綱也能直接生成；先預覽大綱方向更穩。</div>`:""}</div>`;};
  M.manuscript=()=>{const g=S.gen,i=S.view,txt=g.written[i];const title=S.theme?"隋唐書院祭":"未命名手稿";return `<div class="mh"><h3><span class="ms" style="color:var(--ac)">menu_book</span>創作手稿</h3><span class="meta">${esc(title)}</span><span class="sp"></span>
      <div class="seg"><button data-act="hz" aria-pressed="${!S.vertical}">橫排</button><button data-act="vt" aria-pressed="${S.vertical}">直排</button></div>
      <button class="btn sm" data-act="tts"><span class="ms">record_voice_over</span>朗讀</button><button class="btn sm" data-act="shelf"><span class="ms">bookmark_add</span>書櫃收藏</button><button class="btn sm" data-act="download"><span class="ms">download</span>下載</button><button class="btn sm" data-act="read"><span class="ms">auto_stories</span>進入閱讀</button></div>
    <div class="ms-wrap"><nav class="ms-idx"><span class="lbl">CONTENTS 章節索引</span>${g.written.length||g.running?Array.from({length:Math.max(g.written.length+(g.running?1:0),1)},(_,k)=>`<button data-view="${k}" class="${k===i?"on":""}"><span class="n">${String(k+1).padStart(2,"0")}</span>${(S.outline[k]||OUTLINE[k]||["第"+(k+1)+"章"])[0]}</button>`).join(""):`<span style="font-size:12.5px;color:var(--faint);padding:0 8px">故事開始後，章節會在這裡展開。</span>`}</nav>
    <div class="paper ${S.vertical?"v":""}"><div class="paper-hd"><span>${esc(title)}</span><span>第 ${i+1} 章　${(OUTLINE[i]||["續章"])[0]}</span></div><div class="gaoji" data-paper></div><div class="paper-ft"><span data-pft></span><span>AI 小說工坊・原稿用紙</span></div></div></div>
    <details class="log" ${g.written.length?"open":""}><summary>故事連貫性紀錄（${g.written.length?Math.min(g.written.length*1,LOGS.length):0} 條）</summary>${g.written.length?`<ul>${LOGS.slice(0,g.written.length).map(l=>`<li class="${l[2]||""}"><span class="k">${l[0]}</span><span>${l[1]}</span></li>`).join("")}</ul>`:`<p class="note" style="margin:8px 0 0">每完成一章，AI 會整理人物狀態、伏筆與矛盾。</p>`}</details>`;};
  M.shelfmod=()=>`<div class="mh"><h3><span class="ms" style="color:var(--ac)">shelves</span>我的藏書</h3><span class="sp"></span><select class="btn sm" aria-label="排序"><option>最新優先</option><option>書名排序</option><option>長度排序</option></select><button class="btn sm"><span class="ms">upload</span>匯入</button></div>
    <div class="shelf">${[["隋唐書院祭","架空歷史・3 卷・連載中","#244F63"],["血月獻祭","黑暗奇幻・2 卷・已完成","#7A2630"],["業火糖心","都市言情・1 卷・已完成","#9A6224"]].map(b=>`<div class="bk"><span class="cv" style="background:${b[2]}"></span><div class="nm"><b>${b[0]}</b><span>${b[1]}</span></div><button class="btn sm" data-act="read">載入閱讀</button><button class="btn sm" data-act="flip">翻書閱讀</button><button class="btn sm">下載</button><button class="btn sm ghost">編輯</button></div>`).join("")}</div>`;
  M.reader=()=>{const w=S.gen.written;const i=Math.min(S.reader,Math.max(w.length-1,0));const t=w[i]||CHTXT[0];return `<div class="mh"><h3><span class="ms" style="color:var(--ac)">auto_stories</span>翻書閱讀</h3><span class="meta">私人閱覽室</span><span class="sp"></span><button class="btn sm" data-act="tts"><span class="ms">record_voice_over</span>朗讀</button><button class="btn sm" data-act="display"><span class="ms">text_fields</span>顯示設定</button></div>

    <div class="rd-nav"><button class="btn sm" data-act="rprev" ${i<=0?"disabled":""}>‹ 上一章</button><span>${w.length?`${i+1}／${w.length}`:"示範頁（尚未生成正文）"}</span><button class="btn sm" data-act="rnext" ${i>=w.length-1?"disabled":""}>下一章 ›</button></div>`;};

  /* -- side panels (tools) -- */
  const P={
    model:["模型與用量",()=>`<label class="f"><span>選擇模型</span><select data-bind="model">${["DeepSeek V4.1 Flash — 推薦寫作","DeepSeek V4 Pro — 舊版選項"].map(m=>`<option ${m===S.model?"selected":""}>${m}</option>`).join("")}</select></label>
      <div class="sub-h" style="margin-top:20px">用量統計<span style="flex:1"></span><button class="btn sm ghost" data-act="resetUsage">重設</button></div>
      <div class="stat"><div><span>請求次數</span><b>${S.usage.req}</b></div><div><span>輸入 tokens</span><b>${S.usage.inT.toLocaleString()}</b></div><div><span>輸出 tokens</span><b>${S.usage.outT.toLocaleString()}</b></div><div><span>估算費用</span><b>$${cost()}</b></div></div>

    display:["顯示設定",()=>`<div class="sub-h">主題</div><div class="seg"><button data-act="light" aria-pressed="${document.documentElement.dataset.theme!=="dark"}">淺色</button><button data-act="dark" aria-pressed="${document.documentElement.dataset.theme==="dark"}">深色</button></div>
      <div class="sub-h" style="margin-top:18px">字體大小 <b data-live="font" style="font-family:var(--mono);font-weight:500">${S.font}px</b></div><input type="range" min="15" max="24" value="${S.font}" data-bind="font" data-num style="width:100%;accent-color:var(--ac)">
      <div class="sub-h" style="margin-top:18px">排版</div><div class="seg"><button data-act="hz" aria-pressed="${!S.vertical}">橫排</button><button data-act="vt" aria-pressed="${S.vertical}">直排</button></div>
      <label class="f" style="margin-top:18px"><span>閱讀氛圍</span><select><option>無</option><option>圖書館</option><option>雨夜</option><option>書齋</option><option>竹林</option><option>月夜</option></select></label>`],
    template:["快速模板",()=>`<p class="note" style="margin:0 0 12px">一鍵填入故事設定，之後仍可逐項修改。</p><div class="shelf">${TEMPLATES.map((t,i)=>`<div class="bk"><div class="nm"><b style="font-size:15px">${t[0]}</b><span>${t[1].theme}・${t[1].setting}・${t[1].style}</span></div><button class="btn sm pri" data-tpl="${i}">套用模板</button></div>`).join("")}</div>`],
    names:["人名清單",()=>`<p class="note" style="margin:0 0 12px">勾選的名字，AI 設計角色時可以挑選（依性別與定位合理配對）。</p><div class="shelf">${[["沈硯","男"],["柳青棠","女"],["崔夫子","男"],["阿蘅","女"],["韓九","男"]].map(n=>`<label class="bk chk" style="padding:10px 12px"><input type="checkbox" checked>${n[0]}<span style="color:var(--mut);margin-left:auto">${n[1]}</span></label>`).join("")}</div><div style="display:flex;gap:6px;margin-top:12px"><input class="btn" placeholder="新增人名" style="flex:1;min-width:0"><select class="btn"><option>男</option><option>女</option><option>不明</option></select><button class="btn">新增</button></div>`],
    tts:["朗讀控制",()=>`<label class="f"><span>Edge 語音</span><select><option>曉臻（女聲・台灣）</option><option>雲哲（男聲・台灣）</option><option>曉曉（女聲・普通話）</option></select><small>使用 Microsoft Edge 神經語音，依情緒模式自動切換語調。</small></label>
      <div class="fg c2" style="margin-top:14px"><label class="f"><span>語速</span><input type="range" min="0.5" max="2" step="0.1" value="1" style="accent-color:var(--ac)"></label><label class="f"><span>音調</span><input type="range" min="0.5" max="1.5" step="0.1" value="1" style="accent-color:var(--ac)"></label></div>
